<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 공유 미리보기 이미지(1200x630) 원본. ?t=pepero 또는 ?t=christmas. scripts/make-og.ps1이 캡처한다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif; color: #f6f1ea;
    display: flex; flex-direction: column; justify-content: center; padding: 0 90px; box-sizing: border-box;
    background: radial-gradient(700px 400px at 85% 10%, rgba(217, 75, 75, .55), transparent 60%),
                radial-gradient(600px 400px at 0% 100%, rgba(233, 196, 106, .3), transparent 60%), #0b1712;
  }
  body.pepero { background: radial-gradient(700px 400px at 85% 10%, rgba(226, 114, 91, .6), transparent 60%),
                radial-gradient(600px 400px at 0% 100%, rgba(242, 184, 128, .35), transparent 60%), #1a0f0a; }
  .tag { font-size: 30px; font-weight: 700; color: #f4dd9c; letter-spacing: .02em; }
  h1 { font-size: 96px; line-height: 1.15; margin: 18px 0 26px; letter-spacing: -.04em; font-weight: 800; }
  h1 em { font-style: normal; background: linear-gradient(100deg, #f4dd9c, #e9c46a 45%, #e4505f); -webkit-background-clip: text; color: transparent; }
  p { font-size: 32px; color: #d8cbe0; margin: 0; }
  .icon { position: absolute; right: 90px; top: 50%; transform: translateY(-50%); font-size: 230px; filter: drop-shadow(0 20px 40px rgba(0,0,0,.4)); }
  .brand { position: absolute; left: 90px; bottom: 50px; font-size: 26px; font-weight: 800; }
  .brand b { color: #e9c46a; }
</style>
</head>
<body>
  <div class="tag" id="tag"></div>
  <h1 id="h"></h1>
  <p id="p"></p>
  <div class="icon" id="i"></div>
  <div class="brand">🎁 선물고민 <b>끝</b></div>
<script>
  var t = new URLSearchParams(location.search).get('t') || 'christmas';
  var c = {
    pepero: ['2026.11.11 빼빼로데이', '빼빼로 +<br><em>하나 더</em>', '연인 · 친구 · 직장동료 선물 추천', '🍫'],
    christmas: ['2026 크리스마스 · 연말', '선물 고민<br><em>30초면 끝</em>', '받는 사람 · 예산별 맞춤 추천', '🎄']
  }[t];
  document.body.className = t;
  document.getElementById('tag').textContent = c[0];
  document.getElementById('h').innerHTML = c[1];
  document.getElementById('p').textContent = c[2];
  document.getElementById('i').textContent = c[3];
</script>
</body>
</html>
